<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼각비 농구 게임 🏀</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TensorFlow.js 및 Teachable Machine 에러 방지용 임시 객체 선언 -->
    <script>var exports = {};</script>

    <!-- TensorFlow.js & Teachable Machine Pose Models -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdfa; }
        #webcam-container canvas { border-radius: 0.5rem; width: 100%; max-width: 300px; height: auto; }
        #game-canvas { width: 100%; height: auto; background-color: #ffffff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <!-- Header -->
        <div class="bg-teal-600 text-white py-4 px-6 text-center">
            <h1 class="text-3xl font-bold">🏀 삼각비 농구 게임</h1>
            <p class="text-teal-100 mt-2">웹캠 앞에서 정답 높이에 맞는 자세를 취해 슛을 쏘세요!</p>
        </div>

        <!-- Main Content -->
        <div class="p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
            
            <!-- 1. 현재 문제 (모바일: 최상단, 데스크탑: 좌측 상단) -->
            <div class="order-1 lg:col-span-1 bg-gray-100 p-4 rounded-xl text-center shadow-sm">
                <h2 class="text-xl font-bold text-gray-700 mb-2">현재 문제</h2>
                <div id="problem-display" class="text-lg md:text-xl font-semibold text-teal-700 bg-teal-50 p-3 rounded-lg min-h-[80px] flex items-center justify-center break-keep">
                    게임을 시작해주세요!
                </div>
                <p class="text-sm text-gray-500 mt-2">정답: 1m, 2m, 3m 중 하나</p>
            </div>

            <!-- 2. 게임 캔버스 (모바일: 중앙, 데스크탑: 우측 전체 영역) -->
            <div class="order-2 lg:col-span-2 lg:row-span-3 relative w-full flex bg-white border-2 border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <canvas id="game-canvas" class="w-full h-auto aspect-[8/5] block"></canvas>
                
                <!-- Feedback Overlay -->
                <div id="feedback-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300">
                    <span id="feedback-text" class="text-3xl md:text-5xl font-black text-white px-6 md:px-8 py-3 md:py-4 bg-green-500 rounded-full shadow-2xl transform scale-50 transition-transform duration-300">
                        정답! 🏀
                    </span>
                </div>
            </div>

            <!-- 3. 카메라 (모바일: 하단, 데스크탑: 좌측 중앙) -->
            <div class="order-3 lg:col-span-1 bg-gray-100 p-4 rounded-xl flex flex-col items-center shadow-sm">
                <h2 class="text-lg font-bold text-gray-700 mb-2">나의 자세 (AI 인식)</h2>
                <div id="webcam-container" class="bg-gray-200 rounded-lg flex items-center justify-center overflow-hidden aspect-square w-full max-w-[250px]">
                    <span class="text-gray-400 text-sm" id="webcam-placeholder">카메라 대기 중...</span>
                </div>
                <div id="label-container" class="mt-3 w-full space-y-1"></div>
                <button id="start-btn" onclick="initGame()" class="mt-4 w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md text-sm md:text-base">
                    ▶️ 게임 시작 (웹캠 허용)
                </button>
                <div id="loading-msg" class="hidden text-teal-600 font-semibold mt-2 animate-pulse text-sm md:text-base">
                    모델을 불러오는 중입니다...
                </div>
            </div>

            <!-- 4. 점수 (모바일: 최하단, 데스크탑: 좌측 하단) -->
            <div class="order-4 lg:col-span-1 bg-teal-50 p-4 rounded-xl text-center shadow-sm border border-teal-100 flex flex-col justify-center">
                <h2 class="text-lg font-bold text-teal-800">점수</h2>
                <p id="score-display" class="text-3xl md:text-4xl font-black text-teal-600">0</p>
            </div>
        </div>
        
        <!-- Instructions Footer -->
        <div class="bg-gray-50 p-4 border-t border-gray-200 text-sm text-gray-600">
            <strong>게임 방법:</strong> 주어진 거리와 올려다본 각도를 보고 <code>거리 × tan(각도)</code>를 계산하여 골대의 높이(1m, 2m, 3m)를 구하세요. 카메라 앞에서 정답 높이에 해당하는 자세를 약 1초간 유지하면 자동으로 슛을 쏩니다!
        </div>
    </div>

    <script>
        // 제공해주신 모델 URL (1m, 2m, 3m 클래스)
        const URL = "https://teachablemachine.withgoogle.com/models/rQCNoxJaA/";
        
        let model, webcam, ctxWebcam, maxPredictions;
        let isPlaying = false;
        let score = 0;

        // --- 수학 문제 데이터 (정답이 1m, 2m, 3m 인 경우만) ---
        const mathProblems = [
            { dist: '1', angle: '45', ans: '1m', desc: '거리 1m, 올려다본 각도 45°' },
            { dist: '√3', angle: '30', ans: '1m', desc: '거리 √3m, 올려다본 각도 30°' },
            { dist: '2', angle: '45', ans: '2m', desc: '거리 2m, 올려다본 각도 45°' },
            { dist: '2√3', angle: '30', ans: '2m', desc: '거리 2√3m, 올려다본 각도 30°' },
            { dist: '3', angle: '45', ans: '3m', desc: '거리 3m, 올려다본 각도 45°' },
            { dist: '√3', angle: '60', ans: '3m', desc: '거리 √3m, 올려다본 각도 60°' }
        ];

        let currentProblem = null;
        let poseHoldTimer = 0;
        const HOLD_DURATION = 30; // 약 1초 유지 필요 (프레임 단위)
        
        // --- Game Canvas 설정 ---
        const gameCanvas = document.getElementById('game-canvas');
        const ctxGame = gameCanvas.getContext('2d');
        
        // 반응형 확대를 위해 그리기 기준이 되는 가상(Virtual) 해상도 고정값 사용
        const W = 800;
        const H = 500;

        // 캔버스 내 좌표 설정
        const FLOOR_Y = H - 50;
        const PLAYER_X = 100;
        const HOOP_X = W - 150;
        
        // 정답별 골대 높이 (Y좌표) 맵핑 (1m: 300, 2m: 200, 3m: 100)
        const hoopYMap = {
            '1m': FLOOR_Y - 150,
            '2m': FLOOR_Y - 250,
            '3m': FLOOR_Y - 350
        };

        // 공 상태 객체
        let ball = {
            x: PLAYER_X, y: FLOOR_Y - 50,
            isShooting: false,
            progress: 0,
            targetHoop: null
        };

        // 게임 초기화 및 모델 로드
        async function initGame() {
            if (isPlaying) return;
            
            const startBtn = document.getElementById('start-btn');
            const loadingMsg = document.getElementById('loading-msg');
            
            startBtn.classList.add('hidden');
            loadingMsg.classList.remove('hidden');

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // 모델 로드
                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // 웹캠 설정
                const size = 250;
                const flip = true; 
                webcam = new tmPose.Webcam(size, size, flip);
                await webcam.setup(); 
                await webcam.play();
                
                // 루프 시작
                window.requestAnimationFrame(gameLoop);

                // 웹캠 캔버스 UI에 추가
                document.getElementById('webcam-placeholder').style.display = 'none';
                const wcContainer = document.getElementById("webcam-container");
                wcContainer.appendChild(webcam.canvas);

                // 클래스 레이블 UI 생성
                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ''; // 초기화
                for (let i = 0; i < maxPredictions; i++) {
                    const div = document.createElement("div");
                    div.className = "flex justify-between items-center text-sm px-2 py-1 bg-white border border-gray-200 rounded";
                    const spanName = document.createElement("span");
                    spanName.className = "font-semibold text-gray-700";
                    const spanProb = document.createElement("span");
                    spanProb.className = "text-teal-600 font-bold";
                    
                    div.appendChild(spanName);
                    div.appendChild(spanProb);
                    labelContainer.appendChild(div);
                }

                isPlaying = true;
                loadingMsg.classList.add('hidden');
                
                // 첫 문제 출제
                setNextProblem();

            } catch (error) {
                console.error("에러 발생:", error);
                alert("모델을 불러오거나 카메라를 켜는 데 실패했습니다. 카메라 권한을 확인해주세요.");
                startBtn.classList.remove('hidden');
                loadingMsg.classList.add('hidden');
            }
        }

        async function gameLoop() {
            webcam.update(); // 웹캠 프레임 업데이트
            await predictPose(); // 포즈 예측 및 판정
            drawGameScene(); // 캔버스 그리기
            window.requestAnimationFrame(gameLoop);
        }

        async function predictPose() {
            if (!model || ball.isShooting) return;

            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let highestProb = 0;
            let bestClass = "";

            const labelContainer = document.getElementById("label-container");

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                
                // UI 업데이트
                if(labelContainer.childNodes[i]) {
                    labelContainer.childNodes[i].childNodes[0].innerText = className;
                    labelContainer.childNodes[i].childNodes[1].innerText = (probability * 100).toFixed(0) + "%";
                    
                    // 정답에 해당하는 막대는 하이라이트
                    if (currentProblem && className === currentProblem.ans && probability > 0.8) {
                         labelContainer.childNodes[i].classList.add("bg-teal-100", "border-teal-400");
                    } else {
                         labelContainer.childNodes[i].classList.remove("bg-teal-100", "border-teal-400");
                    }
                }

                if (probability > highestProb) {
                    highestProb = probability;
                    bestClass = className;
                }
            }

            // 정답 판정 (확률이 80% 이상일 때)
            if (currentProblem && highestProb > 0.8 && bestClass === currentProblem.ans) {
                poseHoldTimer++;
                // 자세를 일정 시간(HOLD_DURATION) 유지하면 슛!
                if (poseHoldTimer > HOLD_DURATION) {
                    shootBall(bestClass);
                    poseHoldTimer = 0;
                }
            } else {
                poseHoldTimer = 0; // 자세가 흐트러지면 타이머 초기화
            }
        }

        function setNextProblem() {
            // 랜덤으로 문제 선택
            const randIdx = Math.floor(Math.random() * mathProblems.length);
            currentProblem = mathProblems[randIdx];
            document.getElementById('problem-display').innerText = currentProblem.desc;
            
            // 공 위치 초기화
            ball.x = PLAYER_X;
            ball.y = FLOOR_Y - 50;
            ball.isShooting = false;
            ball.progress = 0;
            poseHoldTimer = 0;
        }

        function shootBall(answeredClass) {
            if (ball.isShooting) return;
            ball.isShooting = true;
            ball.targetHoop = answeredClass;
            ball.progress = 0;
            
            // 피드백 UI 표시
            const overlay = document.getElementById('feedback-overlay');
            const text = document.getElementById('feedback-text');
            overlay.classList.remove('opacity-0');
            text.classList.remove('scale-50');
            text.classList.add('scale-100');

            // 점수 증가
            score += 10;
            document.getElementById('score-display').innerText = score;

            // 슈팅 애니메이션 진행
            const shootAnimation = setInterval(() => {
                ball.progress += 0.02; // 이동 속도
                
                // 이차 베지어 곡선 (포물선 궤적)
                const startX = PLAYER_X;
                const startY = FLOOR_Y - 50;
                const endX = HOOP_X;
                const endY = hoopYMap[ball.targetHoop];
                
                // X는 선형 이동
                ball.x = startX + (endX - startX) * ball.progress;
                
                // Y는 포물선 곡선 (중간에 위로 솟구침)
                const arcHeight = 150;
                ball.y = startY + (endY - startY) * ball.progress - Math.sin(ball.progress * Math.PI) * arcHeight;

                if (ball.progress >= 1) {
                    clearInterval(shootAnimation);
                    
                    // 피드백 UI 숨기기
                    setTimeout(() => {
                        overlay.classList.add('opacity-0');
                        text.classList.remove('scale-100');
                        text.classList.add('scale-50');
                        // 다음 문제 출제
                        setNextProblem();
                    }, 1000);
                }
            }, 1000 / 60); // 60fps
        }

        function drawGameScene() {
            // 배경 지우기
            ctxGame.clearRect(0, 0, W, H);

            // 1. 바닥(코트) 그리기
            ctxGame.fillStyle = '#fef3c7'; // 코트 색상
            ctxGame.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
            ctxGame.beginPath();
            ctxGame.moveTo(0, FLOOR_Y);
            ctxGame.lineTo(W, FLOOR_Y);
            ctxGame.strokeStyle = '#d97706';
            ctxGame.lineWidth = 4;
            ctxGame.stroke();

            // 2. 골대 기둥 및 림(Rim) 그리기 (1m, 2m, 3m)
            const hoopLevels = ['1m', '2m', '3m'];
            
            // 메인 기둥
            ctxGame.fillStyle = '#64748b';
            ctxGame.fillRect(HOOP_X + 20, hoopYMap['3m'], 15, FLOOR_Y - hoopYMap['3m']);
            
            hoopLevels.forEach(level => {
                const y = hoopYMap[level];
                
                // 백보드
                ctxGame.fillStyle = '#ffffff';
                ctxGame.fillRect(HOOP_X + 15, y - 40, 10, 60);
                ctxGame.strokeStyle = '#ef4444'; // 빨간 테두리
                ctxGame.lineWidth = 2;
                ctxGame.strokeRect(HOOP_X + 15, y - 40, 10, 60);
                
                // 림 (골대 링)
                ctxGame.fillStyle = '#ef4444';
                ctxGame.fillRect(HOOP_X - 25, y, 40, 6);
                
                // 네트 (그물)
                ctxGame.beginPath();
                ctxGame.moveTo(HOOP_X - 20, y + 6);
                ctxGame.lineTo(HOOP_X - 10, y + 30);
                ctxGame.lineTo(HOOP_X + 10, y + 30);
                ctxGame.lineTo(HOOP_X + 20, y + 6);
                ctxGame.strokeStyle = '#e2e8f0';
                ctxGame.lineWidth = 2;
                ctxGame.stroke();

                // 높이 텍스트 라벨
                ctxGame.fillStyle = '#334155';
                ctxGame.font = 'bold 16px Inter';
                ctxGame.fillText(level, HOOP_X + 35, y + 5);
            });

            // 3. 수학 문제 시각화 (직각삼각형 점선)
            if (currentProblem && !ball.isShooting) {
                const targetY = hoopYMap[currentProblem.ans];
                
                ctxGame.beginPath();
                // 빗변
                ctxGame.moveTo(PLAYER_X, FLOOR_Y);
                ctxGame.lineTo(HOOP_X, targetY);
                // 높이
                ctxGame.lineTo(HOOP_X, FLOOR_Y);
                // 밑변
                ctxGame.lineTo(PLAYER_X, FLOOR_Y);
                
                ctxGame.strokeStyle = 'rgba(20, 184, 166, 0.6)'; // 틸(Teal) 색상 점선
                ctxGame.lineWidth = 3;
                ctxGame.setLineDash([10, 10]);
                ctxGame.stroke();
                ctxGame.setLineDash([]); // 점선 초기화

                // 각도 호(Arc) 그리기
                ctxGame.beginPath();
                ctxGame.arc(PLAYER_X, FLOOR_Y, 40, 0, -Math.atan2(FLOOR_Y - targetY, HOOP_X - PLAYER_X), true);
                ctxGame.strokeStyle = '#ef4444';
                ctxGame.lineWidth = 2;
                ctxGame.stroke();

                // 텍스트 (거리 및 각도)
                ctxGame.fillStyle = '#0f766e';
                ctxGame.font = 'bold 18px Inter';
                // 밑변(거리) 텍스트
                ctxGame.fillText(`거리: ${currentProblem.dist}m`, (PLAYER_X + HOOP_X) / 2 - 30, FLOOR_Y + 25);
                // 각도 텍스트
                ctxGame.fillText(`${currentProblem.angle}°`, PLAYER_X + 50, FLOOR_Y - 10);
                
                // '?' 높이 텍스트
                ctxGame.fillStyle = '#be123c';
                ctxGame.fillText(`h = ?`, HOOP_X - 45, (FLOOR_Y + targetY) / 2);
            }

            // 4. 농구공 그리기
            ctxGame.beginPath();
            ctxGame.arc(ball.x, ball.y, 15, 0, Math.PI * 2);
            ctxGame.fillStyle = '#f97316'; // 주황색
            ctxGame.fill();
            ctxGame.strokeStyle = '#c2410c';
            ctxGame.lineWidth = 2;
            ctxGame.stroke();
            
            // 공 무늬 그리기
            ctxGame.beginPath();
            ctxGame.arc(ball.x, ball.y, 15, Math.PI/4, Math.PI*1.25);
            ctxGame.stroke();
            ctxGame.beginPath();
            ctxGame.arc(ball.x, ball.y, 15, -Math.PI/4, -Math.PI*1.25, true);
            ctxGame.stroke();
            
            // 플레이어 대기 위치 아이콘(단순화된 사람 모양)
            if (!ball.isShooting) {
                ctxGame.fillStyle = '#475569';
                // 몸통
                ctxGame.fillRect(PLAYER_X - 10, FLOOR_Y - 40, 20, 40);
                // 머리
                ctxGame.beginPath();
                ctxGame.arc(PLAYER_X, FLOOR_Y - 50, 12, 0, Math.PI * 2);
                ctxGame.fill();
            }
        }

        // --- 반응형 캔버스 리사이즈 처리 ---
        function handleResize() {
            const rect = gameCanvas.getBoundingClientRect();
            // 디스플레이 픽셀 비율(Retina 등 고해상도 모니터 대응)
            const dpr = window.devicePixelRatio || 1;
            
            // 캔버스의 실제 물리적 크기 설정
            gameCanvas.width = rect.width * dpr;
            gameCanvas.height = (rect.width * (5/8)) * dpr; // 8:5 비율 유지
            
            // 800x500 가상 좌표계를 실제 물리적 크기에 맞게 스케일링
            ctxGame.setTransform(
                (rect.width * dpr) / W, 0, 
                0, ((rect.width * (5/8)) * dpr) / H, 
                0, 0
            );
            
            // 화면 크기가 변했을 때 즉시 다시 그리기
            drawGameScene();
        }

        // 윈도우 크기 변경 시 이벤트 리스너 등록
        window.addEventListener('resize', handleResize);
        
        // 브라우저 초기 로드 시 캔버스 크기 맞춤
        window.addEventListener('load', handleResize);

    </script>
</body>
</html>
